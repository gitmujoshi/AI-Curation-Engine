apiVersion: apps/v1
kind: Deployment
metadata:
  name: perimeter-gateway
  namespace: perimeter
  labels:
    app: perimeter-gateway
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: perimeter-gateway
  template:
    metadata:
      labels:
        app: perimeter-gateway
        version: v1.0.0
    spec:
      containers:
      - name: gateway
        image: gcr.io/PROJECT_ID/perimeter-gateway:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: perimeter-secrets
              key: redis-url
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: perimeter-secrets
              key: database-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: perimeter-secrets
              key: secret-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: perimeter-secrets
              key: openai-api-key
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: perimeter-secrets
              key: anthropic-api-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: perimeter-gateway
  namespace: perimeter
spec:
  selector:
    app: perimeter-gateway
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: perimeter-gateway-hpa
  namespace: perimeter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: perimeter-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
